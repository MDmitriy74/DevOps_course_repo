apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: feedback-quiz
  namespace: homework-2
spec:
  ingressClassName: traefik
  rules:
    - host: traefik.ingress-system.svc.cluster.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: feedback-quiz
                port:
                  number: 80
