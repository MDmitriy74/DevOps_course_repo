fullnameOverride: loki
deploymentMode: Monolithic
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: '2024-01-01'
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    allow_structured_metadata: true
    retention_period: 24h
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  querier:
    max_concurrent: 2
  analytics:
    reporting_enabled: false
singleBinary:
  replicas: 1
  persistence:
    enabled: false
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: '1', memory: 768Mi}
gateway:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
sidecar:
  rules:
    enabled: false
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
