server:
  fullnameOverride: prometheus
  replicaCount: 1
  persistentVolume:
    enabled: false
  retention: 24h
  retentionSize: 2GB
  extraFlags:
    - web.enable-lifecycle
    - web.enable-remote-write-receiver
    - web.enable-otlp-receiver
    - enable-feature=exemplar-storage
  exemplars:
    max_exemplars: 10000
  otlp:
    promote_resource_attributes:
      - service.name
      - service.namespace
      - k8s.namespace.name
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: '1', memory: 1Gi}
  global:
    scrape_interval: 30s
    evaluation_interval: 30s
# Alloy owns scraping; avoid duplicate Kubernetes discovery and series.
scrapeConfigs: null
serverFiles:
  prometheus.yml:
    rule_files: []
    scrape_configs: []
alertmanager:
  enabled: false
prometheus-node-exporter:
  enabled: false
prometheus-pushgateway:
  enabled: false
kube-state-metrics:
  enabled: true
  fullnameOverride: kube-state-metrics
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {cpu: 200m, memory: 192Mi}
