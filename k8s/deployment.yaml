apiVersion: apps/v1
kind: Deployment
metadata:
  name: feedback-quiz
  namespace: homework-1
  labels:
    app: feedback-quiz
spec:
  replicas: 2
  selector:
    matchLabels:
      app: feedback-quiz
  template:
    metadata:
      labels:
        app: feedback-quiz
    spec:
      containers:
        - name: feedback-quiz
          image: localhost:5001/dima-feedback-quiz:v2
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: feedback-quiz-config
            - secretRef:
                name: feedback-quiz-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
              ephemeral-storage: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
              ephemeral-storage: "1Gi"
