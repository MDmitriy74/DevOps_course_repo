fullnameOverride: tempo
replicas: 1
persistence:
  enabled: false
tempo:
  reportingEnabled: false
  retention: 24h
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: '1', memory: 1Gi}
